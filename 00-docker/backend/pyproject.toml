[project]
name = "agoraci-backend"
version = "0.1.0"
description = "Jamakan — backend monolithe modulaire (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    # Web / ASGI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Données
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "numpy>=2.0",
    # Config / validation
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # Infra clients
    "redis>=5.2",
    "aio-pika>=9.5",
    "httpx>=0.28",
    # Sécurité / auth
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
    # Temps réel / notifications
    "websockets>=13.0",
    "pywebpush>=2.0",
    # Ingestion de documents (corpus juridique)
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    # OCR (PDF scannés / images)
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "pillow>=10.0",
    # Stockage objet (avatars, images) — compatible MinIO/S3
    "boto3>=1.35",
    # Suivi d'erreurs (actif seulement si SENTRY_DSN est défini)
    "sentry-sdk[fastapi]>=2.0",
]

[tool.uv]
# Le code (agoraci/) est exécuté via uvicorn, pas installé comme paquet → pas de build.
package = false

[tool.ruff]
# Lint déterministe (indépendant des défauts changeants de Ruff selon la version).
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # erreurs, pyflakes, tri des imports, pyupgrade, bugbear
ignore = [
    "B008",   # appel dans un argument par défaut : c'est le pattern FastAPI Depends()/Query()
    "E501",   # longueur de ligne non bloquante (gérée à la relecture)
]
