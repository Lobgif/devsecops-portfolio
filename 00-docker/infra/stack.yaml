services:
  socketproxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    userns_mode: host
    environment:
      - CONTAINERS=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - IMAGES=1
      - NETWORKS=1
      - PING=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ proxynet ]
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run

  dozzle:
    image: amir20/dozzle:v10.6.9@sha256:6f4644814cce31e11fe80f2610515df6a5a2e40120b4087c298a72df8d65866b
    container_name: dozzle
    command: [ "--no-analytics", "--filter", "label=lab=dozzle" ]
    environment:
      - DOCKER_HOST=tcp://socketproxy:2375
    volumes:
      - dozzle_data:/data
    ports:
      - "8091:8080"
    networks: [ proxynet ]

  migrate:
    image: ghcr.io/lobgif/backend/app:dev@sha256:0fa09d39561404b743bac0c2ecf1f5af7c0c332b26d57cbe43f5ad8cc428d92d
    command: ["sh", "-c", "alembic upgrade head"]
    deploy:
      mode: replicated-job
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100
        reservations:
          memory: 128M
    environment:
      POSTGRES_HOST: db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    networks: [internal]

  api:
    image: ghcr.io/lobgif/backend/app:dev@sha256:0fa09d39561404b743bac0c2ecf1f5af7c0c332b26d57cbe43f5ad8cc428d92d
    read_only: true
    tmpfs:
      - /tmp:size=50m
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    environment:
      POSTGRES_HOST: db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - rabbitmq_user
      - rabbitmq_password
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 5
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 200
        reservations:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks: [public, internal]

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    deploy:
        placement:
            constraints:
            - node.role == manager
            - node.labels.zone == europe
            preferences:
              - spread: node.labels.zone
        resources:
          limits:
            cpus: "1.0"
            memory: 1G
            pids: 300
          reservations:
            memory: 512M
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d \"$$(cat /run/secrets/postgres_db)\""]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    deploy:
        placement:
            constraints:
            - node.role == manager
        resources:
          limits:
            cpus: "0.50"
            memory: 256M
            pids: 100
          reservations:
            memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:0452ee3fd3b9a74160b251e693338616b464f22df4d4ba43304c101bebdca292
    deploy:
        placement:
            constraints:
            - node.role == manager
        resources:
          limits:
            cpus: "0.50"
            memory: 512M
            pids: 300
          reservations:
            memory: 256M
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export RABBITMQ_DEFAULT_USER="$$(cat /run/secrets/rabbitmq_user)"
        export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [internal]

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    deploy:
        placement:
            constraints:
            - node.role == manager
        resources:
          limits:
            cpus: "0.50"
            memory: 512M
            pids: 200
          reservations:
            memory: 256M
    command: server /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    networks: [internal]

  web:
    image: ghcr.io/lobgif/frontend/app:dev@sha256:40e6595f8851121275ff5a39aa1419e058cea55318ad0315782bcee3aa4f7488
    read_only: true
    tmpfs:
      - /tmp:size=50m
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    environment:
      NUXT_API_INTERNAL: http://api:8000
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 200
        reservations:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks: [public]

volumes:
  pgdata:
  dozzle_data:

networks:
  public:
    driver: overlay
    name: jamakan_public
    driver_opts:
      encrypted: "true"
  internal:
    driver: overlay
    name: jamakan_internal
    driver_opts:
      encrypted: "true"
  proxynet:
    driver: overlay
    driver_opts:
      encrypted: "true"
    name: proxynet
    internal: true

secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  postgres_db:
    external: true
  rabbitmq_user:
    external: true
  rabbitmq_password:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
