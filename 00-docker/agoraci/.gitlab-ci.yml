# Pipeline CI/CD Jamakan
# Architecture = monolithe modulaire : UNE image backend + UNE image frontend.
# On construit puis on pousse les deux images vers le GitLab Container Registry,
# avec cache de couches (BuildKit), puis scan de vulnérabilités (Trivy).
#
# Aucun secret en dur : on n'utilise QUE les variables prédéfinies GitLab
# ($CI_REGISTRY, $CI_REGISTRY_USER, $CI_REGISTRY_PASSWORD = $CI_JOB_TOKEN).
# Le registre du projet est : $CI_REGISTRY_IMAGE
#   -> backend  : $CI_REGISTRY_IMAGE/backend
#   -> frontend : $CI_REGISTRY_IMAGE/frontend
#
# Tags poussés :
#   - <short-sha>           : à chaque pipeline (traçabilité)
#   - latest                : sur la branche par défaut
#   - <tag-git> + latest    : sur les tags Git (release, ex. v1.2.0)

stages:
  - test
  - build
  - scan
  - deploy
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # BuildKit : nécessaire pour les `RUN --mount=type=cache` des Dockerfiles
  DOCKER_BUILDKIT: "1"
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

# ──────────────────────────────────────────────────────────────────────────
# TEST — lint léger (n'empêche pas le build : allow_failure)
# ──────────────────────────────────────────────────────────────────────────
lint:backend:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - ruff check backend/agoraci
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: true

# Les scans SAST / Secret-Detection (inclus ci-dessus) tournent en stage `test`.

# ──────────────────────────────────────────────────────────────────────────
# BUILD — construit et pousse les images (template réutilisable)
# ──────────────────────────────────────────────────────────────────────────
.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    BUILDKIT_PROGRESS: plain
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Le driver docker-container (requis pour le cache registre mode=max) a besoin
    # d'un contexte Docker explicite quand dind utilise TLS (contournement GitLab).
    - docker context create tls-environment
    - docker buildx create --use --name agoracibuilder --driver docker-container tls-environment
  script:
    - |
      TAGS="-t $IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then TAGS="$TAGS -t $IMAGE:latest"; fi
      if [ -n "$CI_COMMIT_TAG" ]; then TAGS="-t $IMAGE:$CI_COMMIT_TAG -t $IMAGE:latest"; fi
      echo "Build + push : $TAGS"
    # buildx : push multi-tags en une passe + cache de couches COMPLET (mode=max)
    # exporté vers le registre → apt/uv sync/npm install réutilisés au build suivant.
    - |
      docker buildx build $TAGS \
        --cache-from "type=registry,ref=$IMAGE:buildcache" \
        --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
        --push \
        -f "$CONTEXT/Dockerfile" "$CONTEXT"
  rules:
    # Ne construit les images (long) QUE si le code back/front change.
    # Un commit qui ne touche que la CI/la doc/l'infra saute le build.
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*
        - frontend/**/*

build:backend:
  extends: .build
  variables:
    IMAGE: "$BACKEND_IMAGE"
    CONTEXT: "backend"

build:frontend:
  extends: .build
  variables:
    IMAGE: "$FRONTEND_IMAGE"
    CONTEXT: "frontend"

# ──────────────────────────────────────────────────────────────────────────
# SCAN — vulnérabilités des images construites (Trivy, n'échoue pas le pipeline)
# ──────────────────────────────────────────────────────────────────────────
.trivy:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy --version
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    # Le scan ne tourne que si le build a tourne (memes conditions que .build).
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*
        - frontend/**/*
  allow_failure: true

scan:backend:
  extends: .trivy
  needs: [{ job: "build:backend", optional: true }]
  variables:
    IMAGE: "$BACKEND_IMAGE"

scan:frontend:
  extends: .trivy
  needs: [{ job: "build:frontend", optional: true }]
  variables:
    IMAGE: "$FRONTEND_IMAGE"

# ──────────────────────────────────────────────────────────────────────────
# DEPLOY — déploiement automatique sur le VPS Oracle (uniquement sur main,
# après build/scan verts). Le VPS construit en ARM NATIF (cache local Docker :
# ~2s quand rien ne change, sinon uniquement les couches modifiées). Plus rapide
# et plus simple qu'un cross-build QEMU dans le CI.
#
# AUCUN secret dans ce fichier : tout vient des Variables CI/CD (Protected) :
#   SSH_PRIVATE_KEY (base64), SSH_KNOWN_HOSTS (fichier), DEPLOY_HOST, DEPLOY_USER
# Le .env de prod vit sur le serveur (jamais transféré ni committé).
# ──────────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  # Sérialise TOUTES les opérations sur la VM (deploy/domain:switch/umami:up) :
  # jamais deux à la fois → évite les conflits de conteneurs Docker (recreate).
  resource_group: production
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # SSH_PRIVATE_KEY = clé privée de déploiement encodée en base64 (évite toute
    # corruption de format/fins de ligne au passage par une variable CI).
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Déploiement de $CI_COMMIT_SHORT_SHA sur $DEPLOY_HOST…"
    - |
      git archive --format=tar HEAD | ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" '
        set -e
        cd ~/agoraci
        tar -x
        docker compose --project-directory . -f infra/docker-compose.prod.yml up -d --build
        docker image prune -f'
    - echo "Déploiement terminé."
  environment:
    name: production
    url: https://jamakan.kaedys.com

# ──────────────────────────────────────────────────────────────────────────
# UMAMI:UP — démarrage MANUEL (une fois) de l'analytics Umami sur la VM.
# Réutilise l'accès SSH du déploiement. Écrit les variables Umami dans le .env
# (idempotent : n'ajoute que si absentes) puis lance le profil compose "analytics".
# Variables requises (CI/CD) : ANALYTICS_DOMAIN, UMAMI_DB_PASSWORD, UMAMI_APP_SECRET.
# ──────────────────────────────────────────────────────────────────────────
umami:up:
  stage: deploy
  resource_group: production
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd ~/agoraci
        grep -q '^ANALYTICS_DOMAIN=' .env || printf '\nANALYTICS_DOMAIN=%s\nUMAMI_DB_PASSWORD=%s\nUMAMI_APP_SECRET=%s\n' '$ANALYTICS_DOMAIN' '$UMAMI_DB_PASSWORD' '$UMAMI_APP_SECRET' >> .env
        docker compose --project-directory . -f infra/docker-compose.prod.yml --profile analytics up -d
      "
    - echo "Umami démarré. Traefik obtient le certificat HTTPS dans ~1-2 min."

# ──────────────────────────────────────────────────────────────────────────
# BACKUP:UP — active les sauvegardes PostgreSQL vers S3/R2 (profil compose "backup").
# Réutilise la clé SSH du déploiement. Écrit les variables S3 dans le .env (idempotent)
# puis lance le profil "backup". Variables CI/CD requises :
#   S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (+ S3_REGION opt.)
# ──────────────────────────────────────────────────────────────────────────
backup:up:
  stage: deploy
  resource_group: production
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd ~/agoraci
        grep -q '^S3_BUCKET=' .env || printf '\nS3_ENDPOINT=%s\nS3_BUCKET=%s\nS3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\nS3_REGION=%s\nBACKUP_PASSPHRASE=%s\n' '$S3_ENDPOINT' '$S3_BUCKET' '$S3_ACCESS_KEY_ID' '$S3_SECRET_ACCESS_KEY' '$S3_REGION' '$BACKUP_PASSPHRASE' >> .env
        docker compose --project-directory . -f infra/docker-compose.prod.yml --profile backup up -d
      "
    - echo "Backups actifs — pg_dump quotidien (03h00 UTC) vers S3/R2, retention 14 jours (verifie le bucket R2 et les logs db-backup)."

# ──────────────────────────────────────────────────────────────────────────
# RELEASE — versioning automatique (semantic-release) à partir des commits
# conventionnels (feat:, fix:, …) : calcule la version, met à jour CHANGELOG.md,
# crée le tag Git + la Release GitLab. INACTIF tant que $GITLAB_TOKEN n'existe pas.
#
# Prérequis (une fois) : créer un Project Access Token (scopes api + write_repository,
# rôle Maintainer) et le mettre en variable CI/CD `GITLAB_TOKEN` (Protected).
# ──────────────────────────────────────────────────────────────────────────
release:
  stage: release
  image: node:22-slim
  variables:
    GIT_DEPTH: 0   # semantic-release a besoin de tout l'historique des commits
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_TOKEN'
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    # NB : ne PAS installer conventional-changelog-conventionalcommits séparément
    # (les plugins embarquent la version compatible ; l'ajouter crée un conflit de writer).
    - npm install -g semantic-release@24 @semantic-release/gitlab @semantic-release/changelog @semantic-release/git
  script:
    - npx semantic-release
