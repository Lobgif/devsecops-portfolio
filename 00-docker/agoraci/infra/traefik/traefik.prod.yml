# Configuration statique Traefik - PRODUCTION (Docker Swarm + HTTPS auto)
api:
  dashboard: true
  insecure: false

ping: {}                    # endpoint /ping pour le healthcheck Docker

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  swarm:                      # mode Swarm (et non docker classique)
    exposedByDefault: false
    network: agoraci_public
    endpoint: "unix:///var/run/docker.sock"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
