# Configuration statique Traefik - LOCAL (HTTP simple, dashboard ouvert)
api:
  dashboard: true
  insecure: true            # dashboard sur :8080 (local uniquement)

ping: {}                    # endpoint /ping pour le healthcheck Docker

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    exposedByDefault: false # seuls les services labellisés sont exposés
    network: agoraci_public

log:
  level: INFO

accessLog: {}
