# ============================================================
# Jamakan — Déploiement PRODUCTION (Docker Swarm)
#
# Pré-requis :
#   1. Construire et pousser les images (backend + frontend) vers un registre :
#        export REGISTRY=registry.exemple.ci/agoraci TAG=1.0.0
#        ./scripts/build-push.sh
#   2. Créer les secrets (voir scripts/create-secrets.sh)
#   3. Déployer :
#        docker stack deploy -c infra/docker-stack.yml agoraci
#
# Deux images applicatives seulement : backend (toutes les API) et frontend.
# Le backend est répliqué et auto-redémarré par Swarm.
# Traefik gère le HTTPS automatique (Let's Encrypt) et tourne sur un manager.
# ============================================================

x-deploy-default: &deploy-default
  replicas: 2
  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
  restart_policy:
    condition: on-failure
  resources:
    limits:
      memory: 512M

x-service-common: &service-common
  networks: [public, internal]
  environment:
    ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-agoraci}
    POSTGRES_USER: ${POSTGRES_USER:-agoraci}
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:-agoraci}
    # POSTGRES_PASSWORD, JWT_SECRET, RABBITMQ_PASSWORD : lus depuis /run/secrets
    # --- Auth / OAuth / sessions / frontend ---
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/auth/google/callback
    SESSION_SECRET: ${SESSION_SECRET:-change_me_session}
    FRONTEND_URL: https://${DOMAIN}
    VERIFICATION_CODE_TTL_MINUTES: ${VERIFICATION_CODE_TTL_MINUTES:-15}
    SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
    SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
    # --- IA / RAG + Modération ---
    LLM_PROVIDER: ${LLM_PROVIDER:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5}
    ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    MODERATION_THRESHOLD: ${MODERATION_THRESHOLD:-0.6}
    MODERATION_LEXICON: ${MODERATION_LEXICON:-}
    # --- Brevo (notifications) ---
    BREVO_API_KEY: ${BREVO_API_KEY:-}
    BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Jamakan}
    BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
    BREVO_TEMPLATE_WELCOME: ${BREVO_TEMPLATE_WELCOME:-}
    BREVO_TEMPLATE_VERIFY: ${BREVO_TEMPLATE_VERIFY:-}
    MODERATOR_ALERT_EMAIL: ${MODERATOR_ALERT_EMAIL:-}
  secrets:
    - postgres_password
    - jwt_secret
    - rabbitmq_password

services:
  # ---------------- Reverse proxy ----------------
  gateway:
    image: traefik:v3
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [public]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # accès au socket + ACME

  # ---------------- Infrastructure (stateful) ----------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agoraci}
      POSTGRES_DB: ${POSTGRES_DB:-agoraci}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    secrets: [postgres_password]
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.db == true]  # épingle la base sur un nœud à volume persistant

  redis:
    image: redis:7-alpine
    networks: [internal]
    deploy: { replicas: 1 }

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-agoraci}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets: [rabbitmq_password]
    networks: [internal]
    deploy: { replicas: 1, placement: { constraints: [node.role == manager] } }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [internal]
    deploy: { replicas: 1, placement: { constraints: [node.labels.db == true] } }

  # ---------------- Backend (image unique : toutes les API) ----------------
  backend:
    <<: *service-common
    image: ${REGISTRY}/backend:${TAG:-latest}
    deploy:
      <<: *deploy-default
      labels:
        - traefik.enable=true
        - traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))
        - traefik.http.routers.backend.entrypoints=websecure
        - traefik.http.routers.backend.tls.certresolver=letsencrypt
        - traefik.http.services.backend.loadbalancer.server.port=8000

  # ---------------- Frontend Nuxt 3 (SSR, serveur Node) ----------------
  frontend:
    image: ${REGISTRY}/frontend:${TAG:-latest}
    environment:
      NUXT_API_INTERNAL: http://backend:8000
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NUXT_PUBLIC_SITE_NAME: Jamakan
      NUXT_PUBLIC_GOOGLE_ENABLED: "${NUXT_PUBLIC_GOOGLE_ENABLED:-false}"
    networks: [public]
    deploy:
      <<: *deploy-default
      labels:
        - traefik.enable=true
        - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls.certresolver=letsencrypt
        - traefik.http.routers.frontend.priority=1
        - traefik.http.services.frontend.loadbalancer.server.port=3000

networks:
  public:
    name: agoraci_public
    driver: overlay
    attachable: true
  internal:
    name: agoraci_internal
    driver: overlay

volumes:
  pgdata:
  miniodata:
  letsencrypt:

secrets:
  postgres_password:
    external: true
  jwt_secret:
    external: true
  rabbitmq_password:
    external: true
