# ============================================================
# Jamakan — Orchestration PRODUCTION (VPS, Docker Compose + HTTPS auto)
#
# Pré-requis : un domaine pointant (enregistrement A) vers l'IP du VPS,
# et un .env rempli (ENV=production, DOMAIN=ton-domaine, ACME_EMAIL=...).
#
# Lancer :
#   docker compose --project-directory . -f infra/docker-compose.prod.yml up -d --build
#
# Différences avec le compose local :
#   - Traefik en HTTPS (Let's Encrypt), redirection 80→443, dashboard désactivé
#   - frontend construit en PRODUCTION (Dockerfile, pas Dockerfile.dev)
#   - routage par Host(${DOMAIN}) + TLS (au lieu de localhost)
#   - services internes (postgres/redis/rabbitmq/minio) NON exposés publiquement
# ============================================================

services:
  # ---------------- Reverse proxy + TLS automatique ----------------
  gateway:
    image: traefik:v3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 512
    cpus: 1
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]   # seule capability requise : ouvrir les ports 80/443
    # Toute la config statique passe par des flags → l'e-mail ACME vient du .env
    # (substitué par Compose), donc AUCUN secret/valeur en dur dans un fichier versionné.
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=agoraci_public
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [public]

  # ---------------- Infrastructure (réseau interne uniquement) ----------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 1024
    cpus: 2
    cap_drop: ["ALL"]
    # L'entrypoint officiel (root -> gosu postgres) a besoin de ces caps au demarrage.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 512
    cpus: 1
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 1024
    cpus: 1
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
    cpus: 1
    cap_drop: ["ALL"]   # MinIO ecoute sur 9000/9001 (> 1024) : aucune capability requise
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal, public]
    labels:
      # Sert les fichiers publics (avatars/images) sous /media en HTTPS
      - traefik.enable=true
      - traefik.http.routers.media.rule=Host(`${DOMAIN}`) && PathPrefix(`/media`)
      - traefik.http.routers.media.entrypoints=websecure
      - traefik.http.routers.media.tls=true
      - traefik.http.routers.media.tls.certresolver=letsencrypt
      - traefik.http.routers.media.priority=20
      - traefik.http.services.media.loadbalancer.server.port=9000

  # ---------------- Backend (image unique : toutes les API) ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-agoraci-backend:latest}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    pids_limit: 1024
    cpus: 2
    read_only: true
    tmpfs: ["/tmp"]   # OCR / pdf2image ecrivent leurs temporaires ici ; /imports reste monte
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data/imports:/imports
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [public, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=8000

  # ---------------- Frontend Nuxt 3 (SSR, build production) ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile      # build prod (et non Dockerfile.dev)
      args:
        # Le chemin admin secret doit être connu AU BUILD (renommage de route Nuxt).
        NUXT_PUBLIC_ADMIN_PATH: "${NUXT_PUBLIC_ADMIN_PATH:-admin}"
    image: ${FRONTEND_IMAGE:-agoraci-frontend:latest}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    pids_limit: 512
    cpus: 2
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_INTERNAL: http://backend:8000
      NUXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:-Jamakan}
      NUXT_PUBLIC_GOOGLE_ENABLED: "${NUXT_PUBLIC_GOOGLE_ENABLED:-false}"
      NUXT_PUBLIC_ADMIN_PATH: "${NUXT_PUBLIC_ADMIN_PATH:-admin}"
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: "${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
      # Umami + Sentry front : PAS d'env ici (une valeur vide écraserait le défaut du code
      # au runtime). Les DSN/IDs par défaut sont dans nuxt.config.ts.
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [public, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
      # --- Redirection 301 de l'ANCIEN domaine vers le nouveau (transition de marque) ---
      # ⚠️ N'activer (déployer) qu'APRÈS la bascule DOMAIN=jamakan.kaedys.com : sinon ce
      # routeur entre en conflit avec le routeur frontend qui écoute encore l'ancien host.
      # Le middleware renvoie un 301 permanent en conservant le chemin ($1 = tout après le /).
      - traefik.http.routers.legacyredirect.rule=Host(`agoraci.ibrahimafofana.com`)
      - traefik.http.routers.legacyredirect.entrypoints=websecure
      - traefik.http.routers.legacyredirect.tls=true
      - traefik.http.routers.legacyredirect.tls.certresolver=letsencrypt
      - traefik.http.routers.legacyredirect.priority=50
      - traefik.http.routers.legacyredirect.service=frontend
      - traefik.http.routers.legacyredirect.middlewares=legacyredirect
      - traefik.http.middlewares.legacyredirect.redirectregex.regex=^https?://agoraci\.ibrahimafofana\.com/(.*)
      - traefik.http.middlewares.legacyredirect.redirectregex.replacement=https://jamakan.kaedys.com/$${1}
      - traefik.http.middlewares.legacyredirect.redirectregex.permanent=true

  # ---------------- Analytics respectueux de la vie privée (Umami) ----------------
  # Profil "analytics" : ne démarre PAS avec le déploiement normal.
  # Bring-up (une seule fois, après DNS + variables .env) :
  #   docker compose --project-directory . -f infra/docker-compose.prod.yml --profile analytics up -d
  umami-db:
    image: postgres:16-alpine
    profiles: ["analytics"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 512
    cpus: 1
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umamidata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ["analytics"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 512
    cpus: 1
    cap_drop: ["ALL"]
    restart: unless-stopped
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Désactive le tracking de télémétrie sortant d'Umami lui-même
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [public, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.umami.rule=Host(`${ANALYTICS_DOMAIN}`)
      - traefik.http.routers.umami.entrypoints=websecure
      - traefik.http.routers.umami.tls=true
      - traefik.http.routers.umami.tls.certresolver=letsencrypt
      - traefik.http.services.umami.loadbalancer.server.port=3000

  # ---------------- Sauvegarde PostgreSQL vers un stockage objet externe (S3/R2/B2) ----------------
  # Profil "backup" : ne démarre PAS avec le déploiement normal.
  # pg_dump planifié + upload vers un bucket S3-compatible HORS de la VM (Cloudflare R2, Backblaze B2…).
  # Bring-up (une fois, après variables .env) via le job CI `backup:up`, ou :
  #   docker compose --project-directory . -f infra/docker-compose.prod.yml --profile backup up -d
  # Variables .env requises : S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (S3_REGION opt.)
  db-backup:
    image: eeshugerman/postgres-backup-s3:16
    profiles: ["backup"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 256
    cpus: 1
    cap_drop: ["ALL"]
    restart: unless-stopped
    environment:
      SCHEDULE: "${BACKUP_SCHEDULE:-0 3 * * *}"   # tous les jours à 03h00 (UTC)
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}" # rétention 14 jours
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: "${S3_PREFIX:-agoraci-db}"
      S3_REGION: "${S3_REGION:-auto}"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # Chiffrement GPG optionnel du dump (recommandé) — laissé vide = désactivé
      PASSPHRASE: "${BACKUP_PASSPHRASE:-}"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

networks:
  public:
    name: agoraci_public
  internal:
    name: agoraci_internal

volumes:
  pgdata:
  redisdata:
  miniodata:
  rabbitmqdata:
  letsencrypt:
  umamidata:
