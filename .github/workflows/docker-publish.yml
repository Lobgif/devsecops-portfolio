name: Publier l'image sur Docker Hub ou GitHub Container Registry

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag à promouvoir'
        required: true
      target_env:
        description: 'Environnement cible'
        required: true
        type: choice
        options: [ qa, staging, prod ]

permissions: {}

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/monapp

jobs:
  publier:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Se connecter à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


#      - name: Se connecter à Docker Hub
#        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
#        with:
#          username: ${{ vars.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Construire sans publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:controle

      - name: Bloquer sur les vulnérabilités critiques et hautes
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          image: local://${{ env.IMAGE }}:controle
          only-severities: critical,high
          exit-code: true

      - name: Publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Promouvoir l'image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_ENV: ${{ inputs.target_env }}
          REPO: ${{ github.repository }}
        run: |
            skopeo copy --all --preserve-digests \
              "docker://ghcr.io/${REPO}:${SOURCE_TAG}" \
              "docker://ghcr.io/${REPO}:${TARGET_ENV}"