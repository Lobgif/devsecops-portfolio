name: Publier l'image sur Docker Hub ou GitHub Container Registry

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag à promouvoir'
        required: true
      target_env:
        description: 'Environnement cible'
        required: true
        type: choice
        options: [ qa, staging, prod ]

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publier:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Se connecter à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

#      - name: Se connecter à Docker Hub
#        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
#        with:
#          username: ${{ vars.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Installer crane, grype et syft
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Construire sans publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:dev
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Bloquer sur les vulnérabilités critiques (Grype)
        run: grype "${{ env.IMAGE }}:dev" --fail-on critical

      - name: Bloquer sur les vulnérabilités critiques et hautes (Docker Scout)
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          image: local://${{ env.IMAGE }}:dev
          only-severities: critical,high
          exit-code: true

      - name: Publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.IMAGE }}:dev
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Récupérer le digest avec crane
        id: digest
        run: echo "digest=$(crane digest ${{ env.IMAGE }}:dev)" >> "$GITHUB_OUTPUT"

      - name: Attestation de provenance SLSA (native)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Installer cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Signer puis vérifier par digest
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          IDENTITE: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "${IMAGE_REF}"
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${IDENTITE}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: SBOM CycloneDX de l'image publiée, attesté par digest
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
        run: |
          syft "${IMAGE_REF}" -o cyclonedx-json > sbom.cdx.json
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE_REF}"

      - name: Publier le SBOM comme artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Promouvoir l'image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_ENV: ${{ inputs.target_env }}
          REPO: ${{ github.repository }}
        run: |
            skopeo copy --all --preserve-digests \
              "docker://ghcr.io/${REPO}:${SOURCE_TAG}" \
              "docker://ghcr.io/${REPO}:${TARGET_ENV}"
