name: Build, scan, sign, publish & promote

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag source à promouvoir'
        required: true
        default: dev
      target_env:
        description: 'Environnement cible'
        required: true
        type: choice
        options: [qa, staging, prod]

permissions: {}

jobs:
  image:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      IMAGE: ghcr.io/lobgif/${{ matrix.component }}/app

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Se connecter à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Installer crane, grype et syft
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha

      - name: Build (multi-arch + push sur dev ; amd64 + load sur PR)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: 00-docker
          file: 00-docker/${{ matrix.component }}/Dockerfile
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/lobgif/cache:${{ matrix.component }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/lobgif/cache:{0},mode=max', matrix.component) || '' }}

      - name: Valider la PR (scan de l'image locale)
        if: ${{ github.event_name == 'pull_request' }}
        run: grype "${{ env.IMAGE }}:dev" --fail-on critical

      - name: Récupérer le digest (index multi-arch) avec crane
        if: ${{ github.event_name == 'push' }}
        id: digest
        run: echo "digest=$(crane digest ${{ env.IMAGE }}:dev)" >> "$GITHUB_OUTPUT"

      - name: Scan CVE bloquant (Grype, par digest)
        if: ${{ github.event_name == 'push' }}
        run: grype "${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}" --fail-on critical

      - name: Attestation de provenance SLSA
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Installer cosign
        if: ${{ github.event_name == 'push' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Signer puis vérifier par digest
        if: ${{ github.event_name == 'push' }}
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          IDENTITE: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "${IMAGE_REF}"
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${IDENTITE}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: SBOM CycloneDX attesté par digest
        if: ${{ github.event_name == 'push' }}
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
        run: |
          syft "${IMAGE_REF}" -o cyclonedx-json > "sbom.${{ matrix.component }}.cdx.json"
          cosign attest --yes --type cyclonedx --predicate "sbom.${{ matrix.component }}.cdx.json" "${IMAGE_REF}"

      - name: Publier le SBOM comme artefact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.component }}
          path: sbom.${{ matrix.component }}.cdx.json

  promote:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Se connecter à ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Promouvoir (copie par digest, multi-arch)
        env:
          IMAGE: ghcr.io/lobgif/${{ matrix.component }}/app
          SRC: ${{ inputs.source_tag }}
          DST: ${{ inputs.target_env }}
        run: |
          skopeo copy --all --preserve-digests \
            "docker://${IMAGE}:${SRC}" \
            "docker://${IMAGE}:${DST}"
